name: Build WebClip IPA

on:
  push:
    branches: [main, 'webclip/**']
  workflow_dispatch:

env:
  DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer

permissions:
  contents: read

concurrency:
  group: webclip-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-core:
    name: Rebuild AirLift native core
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust-core/target
          key: native-macos15-${{ runner.arch }}-xcode26-${{ hashFiles('rust-core/Cargo.lock', 'rust-core/**/Cargo.toml') }}
      - name: Test native diagnostic classification
        run: |
          mkdir -p build
          source "$HOME/.cargo/env"
          set -o pipefail
          cargo test --locked --manifest-path rust-core/Cargo.toml --lib 2>&1 | tee build/native-tests.log
      - name: Rebuild device and simulator frameworks
        run: |
          mkdir -p build
          set -o pipefail
          bash build-ios.sh 2>&1 | tee build/native-core.log
      - uses: actions/upload-artifact@v4
        with:
          name: AirliftFFI-native-core
          path: AirliftFFI.xcframework/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-core-log
          path: build/native-*.log
          retention-days: 7

  build:
    needs: native-core
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Replace checked-in framework with rebuilt core
        run: rm -rf AirliftFFI.xcframework
      - uses: actions/download-artifact@v4
        with:
          name: AirliftFFI-native-core
          path: AirliftFFI.xcframework
      - name: Inspect Xcode toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Check WebClip payload and isolation
        run: |
          mkdir -p build
          swiftc ios-app/WebClipSpec.swift ios-app/NetworkStatus.swift scripts/check-webclip.swift -o build/check-webclip
          build/check-webclip
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build unsigned device app and package IPA
        run: |
          set -o pipefail
          bash build-ipa.sh Release 2>&1 | tee build-ipa.log
          mv build/AirCard-iOS.ipa build/AirCard-WebClip-unsigned.ipa
      - name: Validate IPA structure
        run: |
          python3 scripts/verify-ipa.py build/AirCard-WebClip-unsigned.ipa
          shasum -a 256 build/AirCard-WebClip-unsigned.ipa > build/SHA256SUMS.txt
          cp docs/WEBCLIP-TESTING.md build/WEBCLIP-TESTING.md
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: AirCard-WebClip-unsigned-${{ github.run_number }}
          path: |
            build/AirCard-WebClip-unsigned.ipa
            build/SHA256SUMS.txt
            build/WEBCLIP-TESTING.md
          if-no-files-found: error
          retention-days: 30
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_number }}
          path: build-ipa.log
          if-no-files-found: ignore
          retention-days: 7

  ui-smoke:
    needs: native-core
    name: Check Chinese UI and WebClip entry
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: rm -rf AirliftFFI.xcframework
      - uses: actions/download-artifact@v4
        with:
          name: AirliftFFI-native-core
          path: AirliftFFI.xcframework
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Test navigation on simulator without device writes
        run: |
          mkdir -p build
          DEVICE_ID=$(python3 scripts/select-ui-simulator.py)
          xcrun simctl boot "$DEVICE_ID"
          xcrun simctl bootstatus "$DEVICE_ID" -b
          set -o pipefail
          xcodebuild test -project AirCard-iOS.xcodeproj -scheme AirCard-WebClip-UI -destination "platform=iOS Simulator,id=$DEVICE_ID" -resultBundlePath build/WebClipUI.xcresult -parallel-testing-enabled NO -only-testing:AirCard-WebClipUITests -only-testing:AirCard-iOSTests/WebClipReportRefreshTests CODE_SIGNING_ALLOWED=NO 2>&1 | tee build/ui-test.log
      - name: Export screen captures
        if: always()
        run: |
          if [ -d build/WebClipUI.xcresult ]; then
            xcrun xcresulttool export attachments --path build/WebClipUI.xcresult --output-path build/ui-screenshots
          fi
      - name: Upload UI verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WebClip-UI-check-${{ github.run_number }}
          path: |
            build/ui-screenshots
            build/ui-test.log
            build/WebClipUI.xcresult
          retention-days: 14
